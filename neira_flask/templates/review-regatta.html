<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEIRA</title>
  <link rel="stylesheet" href="static/css/styles.css">
  <script src="https://cdn.auth0.com/js/auth0-spa-js/2.0/auth0-spa-js.production.js"></script>
  <script type="module" src="static/js/utils/auth.js"></script>
</head>
<body>
  <!-- Import the page layout component -->
  <script type="module" src="static/js/components/page-layout.js"></script>
  <script type="module" src="static/js/pages/review-regatta.js"></script>

  <page-layout>
    <div class="section content-width">
      <h2 id="regatta-name"></h2>
    </div>
    <div class="section content-width">
      <div id="regatta-comment"></div>
    </div>
    <div class="section content-width">
      <a id="row2k-link" href="">View on row2k</a>
    </div>
    <div class="section columns">
      <div id="races-container"></div>
      <div id="corrections-container"></div>
    </div>
  </page-layout>

  <template id="regatta-template">
    <div class="name"></div>
  </template>

  <template id="heat-template">
    <div class="heat">
      <div class="heat-header name">
      </div>
      <pre class="results-table"></pre>
    </div>
  </template>
</body>
</html>
