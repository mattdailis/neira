Distance: 1350 Conditions: Strong cross-tail wind from starboard throughout racing. Comments: Congratulations to CRLS girls for winning the Mayor's Cup by virtue of winning the 1st boat race. Due to absences on both sides of the boys' teams, several athletes from each team doubled up between the 1st and 2nd boats. To accommodate that, the order of racing was G5, B1, G4, B4, G3, B3, G2, B2, G1. The Mayor's Cup for the boys team will be contested at a later date when the 1st boats can race. Thanks to CRLS for a great day of racing.

 <area alt="" coords="468,173,347,186,272,199,199,220,134,250,79,284,76,280,131,245,197,215,271,194,346,181,473,171" href="https://www.row2k.com/results/resultspage.cfm?UID=4528445F56E2CEC1FD6EFBAE3F85CD69&amp;cat=1" id="edge2" shape="poly" title="NEIRA Girls Fours, du Pont Cup: Pomfret v. BB&amp;N, Gunn, St. Mark's, Taft, Miss Porter's, Winsor			
Distance: 1500m Conditions: Tailwind, crossing tail at times. 9-11 MPH with occasional 17-21 MPH gusts. First 500 meters flatter, with some light chop thereafter. Some rain during G2 and G1 races. Comments: Alternated races with boys. Order of girls races: G5, G6/Novice, G3, G4, G2, G1. Winds picked up slightly during the race day. Winsor G6's stroke had the collar slide off the oar in the last 400m of the race and had to spend a considerable amount of time stopped to try to fix it. St. Mark's registered a protest at the end of the day in the G3 race. St. Mark's was in the lane along the shore and Winsor was in lane next to them. St. Marks says they clashed oars consistently throughout the first few minutes of the race and were being pushed closer to the shore with nowhere to go. They say the edge of one of the oars is now chipped because of this. Neither of the trailing coaches nor the aligner noticed any clashing of oars (though it was a seven boat race and there was a lot to keep an eye on). Congratulations to St. Mark's G1 for winning the 2026 du Pont Cup.
None"/>

Distance: 1350 Conditions: Great conditions overall. Flat water, slight crosswind. Order of racing 6-5-4-3-2-1 Comments: In the G6 race, Winsor caught an over the head crab in the first 100 meters. The crews were realigned, and the race was restarted from about 200 meters in. 
In the G4 race, Greenwich steered off the race course in the last 200 meters, cutting to the finish. It did not impact order of finish, but likely impacted margins.
