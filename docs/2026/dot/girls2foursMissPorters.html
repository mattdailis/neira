 <area alt="" coords="64,51,76,88,84,105,96,119,119,136,145,148,203,164,198,166,144,153,117,141,93,123,80,108,71,90,64,56" href="https://www.row2k.com/results/resultspage.cfm?UID=4528445F56E2CEC1FD6EFBAE3F85CD69&amp;cat=1" id="edge7" shape="poly" title="NEIRA Girls Fours, du Pont Cup: Pomfret v. BB&amp;N, Gunn, St. Mark's, Taft, Miss Porter's, Winsor			
Distance: 1500m Conditions: Tailwind, crossing tail at times. 9-11 MPH with occasional 17-21 MPH gusts. First 500 meters flatter, with some light chop thereafter. Some rain during G2 and G1 races. Comments: Alternated races with boys. Order of girls races: G5, G6/Novice, G3, G4, G2, G1. Winds picked up slightly during the race day. Winsor G6's stroke had the collar slide off the oar in the last 400m of the race and had to spend a considerable amount of time stopped to try to fix it. St. Mark's registered a protest at the end of the day in the G3 race. St. Mark's was in the lane along the shore and Winsor was in lane next to them. St. Marks says they clashed oars consistently throughout the first few minutes of the race and were being pushed closer to the shore with nowhere to go. They say the edge of one of the oars is now chipped because of this. Neither of the trailing coaches nor the aligner noticed any clashing of oars (though it was a seven boat race and there was a lot to keep an eye on). Congratulations to St. Mark's G1 for winning the 2026 du Pont Cup.
None"/>

Distance: 1500 Conditions: Racing started out with a light port-side crosswind breeze from approximately 400m–750m for the lower boats, but the water remained quite protected. By third boat races, the crosswind started to reform into a true tail down the course, still leaving the water relatively protected for most of the race, with some very light chop in the final 500. Comments: In the G1 event, Porter's caught a crab near the final 500 that nearly stopped the boat, but the crew recovered admirably and raced hard to the finish.
Note that in the interest of time for NEIRA seeding, these results temporarily omit the G5 and GN race, as there is a delay in compiling data for those early races. G5 and GN will be updated in short order.
