Distance: 1300 Conditions: Wild and windy day of racing on the powerhouse. All crews persevered through a strong flow and steady headwind with frequent gusts up to 25 mph. Race order: 5V (Nobles &amp; CRLS), Novice 8+, G4, G3, G2, G1, Novice/Composite lower boat 8+. In the G1 race, both Nobles and CRLS stopped before the start line and drifted into it. This did not impact finish order, but did impact margin. In the final N8+ race, a gust of wind pushed the Nobles crew into the CRLS crew as they entered River Street bridge, hitting the bridge and causing an over-the-head crab. The race was paused to recompose and restarted. Resilience award to this CRLS crew for regaining composure and great rowing through some gnarly crabs! Thank you Nobles and CRLS for a great race!
