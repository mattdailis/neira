 <area alt="" coords="430,180,382,198,327,220,273,250,225,281,222,277,270,245,325,215,380,192,435,178" href="https://www.row2k.com/results/resultspage.cfm?UID=AD1DB8B7FF440FDBF5A8B2F0C30E70D1&amp;cat=6" id="edge7" shape="poly" title="NEIRA Boys &amp; Girls Fours, Founders Day Regatta			
Conditions: Competing Programs: Hotchkiss, Berkshire, Miss Porter’s Canterbury, Rumsey Hall, Hopkins, Lyme/Old Lyme, Greenwich Academy, Choate, Northfield Mount Hermon, Taft, Suffield, Brewster, Notre Dame West Haven, Pomfret, Gunn A very windy day on Lake Waramaug led to first a pause in racing and then, following a restart with a truncated, ‘straight final’ format, an early conclusion also due to wind. Girls’ and Boys’ 4V and Girls’ 3V ran as scheduled in the morning, after which point racing paused. The regatta resumed following a resolution to start with both flights of girls’ 1V, then boys 1V, then girls’ 2V, then boys’ 2V, with a possibility of getting to the boys’ 3V, all without afternoon finals; girls’ and boys’ 1V and girls’ 2V were able to get their one race each despite headwinds building again in each successive race before racing ultimately ended for the day. Stiff and steady AM headwinds built finally to 10+ knots in the morning with gusts far in excess of that, leading to chop increasing drastically from the finish up to the start; upon resumption of racing after the morning pause, the first girls’ 1V race featured relatively clean water with a steady headwind before wind speeds built again to 10+ knots with gusts, chop and white caps by the end of the race day. Thank you to all programs for coming out and being so patient with Gunn’s regatta staff as we navigated some very tricky conditions and decisions. Here's to a calm, sunny day next year."/>
